name: 功能建議
description: 建議新增功能或改進現有行為
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 描述目前的限制，以及它為什麼造成困擾。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
      description: 你希望它怎麼運作？若有 API 構想請一併提出。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他考慮過的做法
